# Compile le moteur AIRCore (GeckoView modifié) et publie le .aar dans « Releases ».
name: Compiler AIRCore

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aircore
  cancel-in-progress: true

jobs:
  aar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MOZCONFIG: ${{ github.workspace }}/aircore/mozconfig
      GECKO_GIT: https://github.com/mozilla-firefox/firefox
      MOZBUILD_STATE_PATH: /home/runner/.mozbuild
    steps:
      - uses: actions/checkout@v4

      - name: Libérer de la place sur le disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Lire la version
        run: |
          grep -E '^[A-Z_]+=' GECKO_VERSION >> "$GITHUB_ENV"

      - name: Récupérer le code Gecko officiel
        run: |
          git init -q gecko
          git -C gecko remote add origin "$GECKO_GIT"
          git -C gecko fetch -q --depth 60 origin "$GECKO_REF"
          git -C gecko checkout -q FETCH_HEAD
          git -C gecko log -1 --format='Gecko : %H %s'

      - name: Appliquer les modifications AIRCore
        run: python3 aircore/patch.py gecko

      - name: Cache des outils Mozilla
        uses: actions/cache@v4
        with:
          path: /home/runner/.mozbuild
          key: mozbuild-${{ env.GECKO_REF }}
          restore-keys: mozbuild-

      - name: Installer les outils (mach bootstrap)
        working-directory: gecko
        run: |
          ./mach --no-interactive bootstrap --application-choice="GeckoView/Firefox for Android Artifact Mode"

      - name: Compiler Gecko (mode rapide)
        working-directory: gecko
        run: ./mach build

      - name: Construire le .aar (et le dépôt Maven)
        working-directory: gecko
        run: ./mach gradle geckoview:publishDebugPublicationToMavenRepository

      - name: Rassembler le .aar
        run: |
          mkdir -p out
          M=gecko/obj-aircore/gradle/maven
          AAR=$(find "$M" -name '*.aar' | head -1)
          POM=$(find "$M" -name '*.pom' -path '*/aircore*' | head -1)
          echo "Trouvé : $AAR / $POM"
          test -n "$AAR" && test -n "$POM"
          GROUP=$(sed -n 's:.*<groupId>\(.*\)</groupId>.*:\1:p' "$POM" | head -1)
          ART=$(sed -n 's:.*<artifactId>\(.*\)</artifactId>.*:\1:p' "$POM" | head -1)
          VER=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' "$POM" | head -1)
          echo "$GROUP:$ART:$VER" > "$M/COORDS"
          cat "$M/COORDS"
          NAME="AIRCore-${AIRCORE_VERSION}.${GITHUB_RUN_NUMBER}-gecko${GECKO_LABEL}-arm64-v8a.aar"
          cp "$AAR" "out/$NAME"
          (cd "$M" && zip -qr "$GITHUB_WORKSPACE/out/aircore-maven.zip" .)
          echo "AAR_NAME=$NAME" >> "$GITHUB_ENV"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AAR_NAME }}
          path: out/

      - name: Publier dans Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${AIRCORE_VERSION}.${GITHUB_RUN_NUMBER}" "out/${AAR_NAME}" out/aircore-maven.zip --latest \
            --title "AIRCore ${AIRCORE_VERSION}.${GITHUB_RUN_NUMBER} (Gecko ${GECKO_LABEL})" \
            --notes "Moteur AIRCore pour Android arm64, basé sur Gecko ${GECKO_LABEL} (${GECKO_REF::12}), sans télémétrie ni rapports de plantage."
